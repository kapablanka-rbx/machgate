name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-arm64:
    name: Linux ARM64 release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check out Apple-ABI libc++ source
        run: git submodule update --init --depth 1 extern/llvm-project

      - name: Set release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Build ARM64 toolchain image
        run: |
          docker build \
            -t machgate-arm64-toolchain \
            -f .github/docker/arm64-toolchain.Dockerfile \
            .

      - name: Build, test, and stage release
        run: |
          rm -rf dist package
          mkdir -p dist package
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            machgate-arm64-toolchain \
            bash -lc '
              set -euo pipefail
              export LLVM_MC="$(command -v llvm-mc-18 || command -v llvm-mc)"
              export LD64_LLD="$(command -v ld64.lld-18 || command -v ld64.lld)"
              export LLVM_LIPO="$(command -v llvm-lipo-18 || command -v llvm-lipo)"
              cmake -S . -B build-arm64-release -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/opt/machgate
              cmake --build build-arm64-release --verbose -j1
              BUILD_DIR=/work/build-arm64-release bash tests/fixtures/build_fixtures.sh
              BUILD_DIR=/work/build-arm64-release bash tests/run_tests.sh
              DESTDIR=/work/package cmake --install build-arm64-release
              test -x /work/package/opt/machgate/bin/machgate
              test -f /work/package/opt/machgate/lib/libmachgate_vm_interpose.so
              test -f /work/package/opt/machgate/lib/libsystem_shim.so
              for provider in apple_compat foundation icu; do
                test -f "/work/package/opt/machgate/lib/libmachgate_${provider}.so"
              done
              MACHGATE_SHIM_LIB=/work/build-arm64-release/libsystem_shim.so scripts/build-libcxx.sh
              MACHGATE_REQUIRE_LIBCXX_OVERLAY=1 LIBCXX_DIR=/work/build-libcxx/lib bash tests/test_libcxx_allocator_overlay.sh
              MACHGATE_REQUIRE_LIBCXX_CTYPE_ABI=1 BUILD_DIR=/work/build-arm64-release LIBCXX_DIR=/work/build-libcxx/lib bash tests/test_libcxx_ctype_abi_surface.sh
              cp -a build-libcxx/lib/libc++.so* /work/package/opt/machgate/lib/
              cp -a build-libcxx/lib/libc++abi.so* /work/package/opt/machgate/lib/
              for dependency in libicui18n.so.74 libicuuc.so.74 libicudata.so.74 libstdc++.so.6 libgcc_s.so.1; do
                cp -a /usr/lib/aarch64-linux-gnu/${dependency}* /work/package/opt/machgate/lib/
              done
              if compgen -G "/usr/lib/aarch64-linux-gnu/libatomic.so.1*" >/dev/null; then
                cp -a /usr/lib/aarch64-linux-gnu/libatomic.so.1* /work/package/opt/machgate/lib/
              else
                echo "libatomic.so.1 runtime dependency not found" >&2
                exit 1
              fi
              mkdir -p /work/package/opt/machgate/share/doc/machgate
              cp README.md /work/package/opt/machgate/share/doc/machgate/
              cp extern/llvm-project/libcxx/LICENSE.TXT /work/package/opt/machgate/share/doc/machgate/LICENSE.libcxx.txt
              cp extern/llvm-project/libcxxabi/LICENSE.TXT /work/package/opt/machgate/share/doc/machgate/LICENSE.libcxxabi.txt
              if [ -f /usr/share/doc/libatomic1/copyright ]; then
                cp /usr/share/doc/libatomic1/copyright /work/package/opt/machgate/share/doc/machgate/LICENSE.libatomic.txt
              fi
              cp docs/*.md /work/package/opt/machgate/share/doc/machgate/
              cp providers/foundation/archive/COPYING /work/package/opt/machgate/share/doc/machgate/LICENSE.foundation-archive.txt
              cp providers/foundation/archive/NOTICE.md /work/package/opt/machgate/share/doc/machgate/NOTICE.foundation-archive.md
              cp providers/apple_compat/COPYING /work/package/opt/machgate/share/doc/machgate/LICENSE.apple-compat.txt
              cp providers/apple_compat/NOTICE.md /work/package/opt/machgate/share/doc/machgate/NOTICE.apple-compat.md
              cp /usr/share/doc/libicu74/copyright /work/package/opt/machgate/share/doc/machgate/LICENSE.icu.txt
              cp /usr/share/doc/libstdc++6/copyright /work/package/opt/machgate/share/doc/machgate/LICENSE.libstdcxx.txt
              cp /usr/share/doc/libgcc-s1/copyright /work/package/opt/machgate/share/doc/machgate/LICENSE.libgcc.txt
            '
          version="${RELEASE_TAG#v}"
          tar -C package/opt -czf "dist/machgate-${version}-linux-arm64.tar.gz" machgate
          tmpdir="$(mktemp -d)"
          tar -C "$tmpdir" -xzf "dist/machgate-${version}-linux-arm64.tar.gz"
          set +e
          "$tmpdir/machgate/bin/machgate" "$PWD/tests/fixtures/darwin_exit42"
          guest_status="$?"
          set -e
          if [ "$guest_status" -ne 42 ]; then
            echo "Installed MachGate exit smoke test returned $guest_status, expected 42" >&2
            exit 1
          fi
          MACHGATE_REQUIRE_LIBCXX_OVERLAY=1 \
            LIBCXX_DIR="$tmpdir/machgate/lib" \
            bash tests/test_libcxx_allocator_overlay.sh
          MACHGATE_REQUIRE_LIBCXX_CTYPE_ABI=1 \
            BUILD_DIR="$tmpdir/machgate/lib" \
            LIBCXX_DIR="$tmpdir/machgate/lib" \
            bash tests/test_libcxx_ctype_abi_surface.sh
          docker run --rm -v "$PWD:/work" -v "$tmpdir:/package" -w /work \
            machgate-arm64-toolchain bash -lc '
              set -euo pipefail
              export LD_LIBRARY_PATH=/package/machgate/lib
              export BUILD_DIR=/package/machgate/lib
              export MACHGATE_TEST_BINARY=/package/machgate/bin/machgate
              export MACHGATE_TEST_ICU_PROVIDER=/package/machgate/lib/libmachgate_icu.so
              export MACHGATE_TEST_LIBCXX=/package/machgate/lib/libc++.so.1
              export MACHGATE_REQUIRE_LIBCXX=1
              bash tests/test_icu_runtime_isolation.sh
              bash tests/test_objc_exception_personality.sh
            '
          rm -rf "$tmpdir"
          sha256sum "dist/machgate-${version}-linux-arm64.tar.gz" > "dist/machgate-${version}-linux-arm64.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: machgate-linux-arm64-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MachGate ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: dist/*
