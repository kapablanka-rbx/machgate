# libfbxsdk.dylib runtime patches
#
# FbxFileUtils::FGets(pStr, pStrLen, FILE*) reads OBJ lines by mutating the
# macOS FILE layout in place: _p at +0, _r at +8, refill via __srget. glibc
# FILE has _IO_read_ptr at +8, so the writes corrupt the stream state and
# every later fscanf on the same FILE returns garbage (OBJ import hangs or
# fails). The function has fgets semantics, and the register state at entry
# already matches fgets(char* s, int n, FILE* stream), so redirect it to the
# dylib's own bound fgets stub.
#
# 0x4bc59c is the __stubs entry whose la_symbol_ptr slot (0x5b47c0) binds
# _fgets; addresses are unslid VM addresses in the arm64 slice.
at sym:__ZN6fbxsdk12FbxFileUtils5FGetsEPciP7__sFILE  b 0x4bc59c  ; expect A9BB67FA
